<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Beam Analysis Web App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/c3/0.7.20/c3.min.css"/>
  <link rel="stylesheet" href="Style.css"/>
</head>
<body>
  <div class="container">

    <h1>Beam Analysis</h1>

    <!-- === SECTION: Beam Configuration === -->
    <section class="section-panel" id="beamConfig">
      <h2>1. Beam Configuration</h2>
      <div class="form-row">
        <label>Support Type
          <select id="supportType">
            <option value="simply">Simply Supported</option>
            <option value="overhang">Simply + Overhang</option>
            <option value="cantilever">Cantilever</option>
            <option value="fixed">Fixed–Fixed</option>
          </select>
        </label>
        <label>Left Overhang (m)
          <input type="number" id="ovLeft" min="0" step="0.1" value="0"/>
        </label>
        <label>Span Length (m)
          <input type="number" id="beamLength" min="0.1" step="0.1" value="5"/>
        </label>
        <label>Right Overhang (m)
          <input type="number" id="ovRight" min="0" step="0.1" value="0"/>
        </label>
      </div>
      <div class="form-row">
        <label>Young’s Modulus E (GPa)
          <input type="number" id="E" step="1" value="210"/>
        </label>
        <label>Moment of Inertia I (m⁴)
          <input type="number" id="I" step="1e-6" value="8e-5"/>
        </label>
      </div>
    </section>

    <!-- === SECTION: Load Definition === -->
    <section class="section-panel" id="loadDefinition">
      <h2>2. Define Load</h2>
      <div class="form-row">
        <label>Load Type
          <select id="loadType">
            <option value="point">Point</option>
            <option value="udl">Uniformly Distributed (UDL)</option>
            <option value="triangular">Triangular</option>
          </select>
        </label>
        <div id="loadInputs"></div>
        <button id="addLoadBtn">Add Load</button>
      </div>
    </section>

    <!-- === SECTION: Load List & Actions === -->
    <section class="section-panel" id="loadList">
      <h2>3. Loads &amp; Actions</h2>
      <table id="loadTable">
        <thead>
          <tr><th>#</th><th>Type</th><th>Parameters</th><th>Action</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="actions">
        <button id="genBtn" class="primary">Generate Diagrams</button>
        <button id="clearBtn" class="secondary">Clear All</button>
        <button id="exportCSV" class="secondary">Export CSV</button>
        <button id="exportPNG" class="secondary">Export PNG</button>
      </div>
    </section>

    <!-- === SECTION: Shear Force Diagram === -->
    <section class="section-panel">
      <h2>4. Shear Force Diagram (SFD)</h2>
      <div id="chartSFD"></div>
    </section>

    <!-- === SECTION: Bending Moment Diagram === -->
    <section class="section-panel">
      <h2>5. Bending Moment Diagram (BMD)</h2>
      <div id="chartBMD"></div>
    </section>

    <!-- === SECTION: Deflection Curve === -->
    <section class="section-panel">
      <h2>6. Deflection Curve</h2>
      <div id="chartDefl"></div>
    </section>

    <!-- === SECTION: Results === -->
    <section class="section-panel" id="results">
      <h2>7. Max/Min Results</h2>
      <div class="results-grid">
        <div>Max Shear: <span id="maxShear">–</span> kN</div>
        <div>Min Shear: <span id="minShear">–</span> kN</div>
        <div>Max Moment: <span id="maxMoment">–</span> kN·m</div>
        <div>Min Moment: <span id="minMoment">–</span> kN·m</div>
        <div>Max Deflection: <span id="maxDefl">–</span> mm</div>
      </div>
    </section>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/5.16.0/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/c3/0.7.20/c3.min.js"></script>
  <script src="Script.js"></script>
</body>
</html>
